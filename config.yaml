run:
  output_dir: ./review
  work_dir: ./work
  db_path: ./data/prism.db
  max_retries: 3
  retry_backoff_s: [1, 4, 16]
  worker_heartbeat_stale_s: 15

adapters:
  cards:
    default: templated
  export:
    default: zip

assets:
  fonts_dir: ./assets/fonts
  styles_dir: ./assets/styles

discovery:
  sources:
    google_news_rss:   { enabled: true }
    hackernews:        { enabled: true }
  clustering:
    threshold: 0.80          # ⚠️ TUNE — replace with embeddings if precision matters
  cache_ttl_min: 15
  fetch_timeout_s: 10
  max_candidates_per_source: 40
  top_n_to_ui: 12
  scoring:
    # ⚠️ DEFAULTS ONLY — educated guesses. Tune after ~20 real runs.
    weights:
      safety: 0.30
      angle_ability: 0.25
      visual_potential: 0.20
      heuristic: 0.15
      saturation: -0.10
    hard_filter:
      safety_min: 0.40      # ⚠️ TUNE — start strict, loosen if too many drops
    source_reliability:
      google_news_rss: 1.0
      hackernews: 0.9
      google_trends_csv: 1.0
      manual: 0.7
  angles:
    count: 3
    route_plugin_via_llm: true

validation:
  min_file_size_mb: 0.05
  caption_max_chars: 2200
  hashtags_max: 30

policy:
  ai_disclosure: required
