name: facts_carousel
version: 0.1.0
description: Evergreen "did you know" fact carousel
entrypoint: prism.plugins.facts_carousel.plugin:FactsCarouselPlugin
extends: carousel
output_kind: image_sequence

defaults:
  aspect_ratio: "4:5"
  resolution: "1080x1350"
  slide_count: 7              # cover + 5 facts + CTA
  style: cream
  cover_headline_max: 60
  content_heading_max: 50
  content_body_max: 260
  cta_max: 80

assets:
  - { kind: script, adapter: llm }
  - { kind: slide,  adapter: cards }

discovery:
  preferred_sources: [reddit, google_news_rss, hackernews, google_trends_csv, manual]
  freshness_window_h: null

policy:
  ai_disclosure: required
  min_slides: 5
  max_slides: 10
