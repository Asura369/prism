[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prism"
version = "0.1.0"
description = "A human-in-the-loop content automation framework."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "feedparser>=6,<7",
  "python-multipart>=0.0.33,<1",
  "Pillow>=13,<14",
  "openai>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["prism*"]

[tool.setuptools.package-data]
prism = ["plugins/*/manifest.yaml", "providers/*/manifest.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
